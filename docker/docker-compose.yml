# Hellcraft server. Put hellcraft-<version>.jar in ./mods next to this file, then:
#   docker compose up -d
# Players join with a plain vanilla client of the same Minecraft version - nothing to install.
services:
  hellcraft:
    # Minecraft 26.3: use itzg/minecraft-server:java25 and VERSION "26.3" (and the -mc26.3 jar)
    image: itzg/minecraft-server:java21
    container_name: hellcraft
    ports:
      - "25565:25565"
      # Lucifer's boss music pack (only needed if you add .ogg files, see README "Boss music")
      - "25566:25566"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      # The Hellcraft resource pack (Lucifer, weapons, music) is sent to each player from the address they
      # joined with, on port 25566 (keep it forwarded like 25565). Only set this to override that address,
      # e.g. behind a proxy (1.21.1 still needs it).
      # HELLCRAFT_PACK_HOST: "play.example.com"
      # Server operators (admins): comma-separated Minecraft usernames
      OPS: "Blender_Uploads"
      # Fabric API is downloaded automatically; Hellcraft comes from ./mods
      MODRINTH_PROJECTS: "fabric-api"
      # The Inferno world preset (a fresh world is required: delete ./data/world to regenerate)
      LEVEL_TYPE: "hellcraft:inferno"
      DIFFICULTY: "hard"
      MOTD: "§4Lasciate ogne speranza, voi ch'intrate"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      MEMORY: "6G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "change-me"
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
    restart: unless-stopped
