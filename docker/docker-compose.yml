# Hellcraft server (Minecraft 26.3). Put hellcraft-<version>-mc26.3.jar in ./mods next to this file, then:
#   docker compose up -d
# Every player needs Hellcraft too, the same version as the server: the Hellcraft modpack (.mrpack) from the
# Releases page, opened in the Modrinth App or Prism Launcher. Players without it are told what to install.
services:
  hellcraft:
    image: itzg/minecraft-server:java25
    container_name: hellcraft
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      # Server operators (admins): comma-separated Minecraft usernames
      OPS: "Blender_Uploads"
      # Fabric API is downloaded automatically; Hellcraft comes from ./mods
      MODRINTH_PROJECTS: "fabric-api"
      # The Inferno world preset (a fresh world is required: delete ./data/world to regenerate)
      LEVEL_TYPE: "hellcraft:inferno"
      DIFFICULTY: "hard"
      MOTD: "§4Lasciate ogne speranza, voi ch'intrate"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      MEMORY: "6G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "change-me"
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
    restart: unless-stopped
