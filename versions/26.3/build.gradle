// Hellcraft for Minecraft 26.3.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+26.3"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

def root = rootDir.toPath().resolve('../..').normalize().toFile()

// Client-only code lives in src/client (HellcraftClient); everything else in src/main runs on both sides.
loom {
	splitEnvironmentSourceSets()
	mods {
		hellcraft {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests (src/gametest): a real client, headless under Xvfb, that joins worlds and servers and saves
// screenshots to build/run/clientGameTest/screenshots. Run with ./gradlew runClientGameTest (see tools/dev/clienttest.sh).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "hellcraft-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xmaxerrs', '5000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	from(new File(root, 'LICENSE')) {
		rename { "${it}_${project.archives_base_name}" }
	}
}
