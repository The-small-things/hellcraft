name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Hellcraft for Minecraft 26.3 (versions/26.3), built with Java 25. The 1.21.1 project at the repository
  # root is frozen and no longer built.
  build-26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (26.3)
        working-directory: versions/26.3
        run: ./gradlew build --stacktrace
      - name: Upload mod jar (26.3)
        uses: actions/upload-artifact@v4
        with:
          name: hellcraft-jar-26.3
          path: versions/26.3/build/libs/hellcraft-*.jar
          if-no-files-found: error
      - name: Package single-player downloads (26.3)
        run: bash scripts/package-singleplayer.sh versions/26.3
      - name: Upload single-player downloads (26.3)
        uses: actions/upload-artifact@v4
        with:
          name: hellcraft-singleplayer-26.3
          path: dist/*
          if-no-files-found: error

  # Boots a real Fabric 26.3 server (the same Docker image used for hosting, Java 25) with the mod,
  # generates chunks in every circle of Hell and fails on any error in the log.
  smoke-test-26:
    needs: build-26
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hellcraft-jar-26.3
          path: mods
      - name: Install ffmpeg (for a test music track)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Smoke test on a real 26.3 server
        env:
          MC_VERSION: "26.3"
          MC_IMAGE: itzg/minecraft-server:java25
        run: bash scripts/smoke-test.sh mods
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-26.3
          path: smoke-server.log

  # A real Minecraft client, headless (Xvfb, software Vulkan): joins a dedicated server and a single-player world,
  # and screenshots the HUD, the blood items and the animated test rig (see versions/26.3/src/gametest).
  client-test-26:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display and software graphics
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
      - name: Client game tests
        run: bash tools/dev/clienttest.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots-26.3
          path: versions/26.3/build/run/clientGameTest/screenshots
          if-no-files-found: warn

  # Publishes the single-player downloads as a GitHub pre-release so they can be grabbed with one click.
  release:
    needs: [build-26, smoke-test-26, client-test-26]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    # one test release at a time: two pushes in a row must not race over the same tag
    concurrency:
      group: test-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hellcraft-singleplayer-26.3
          path: dist
      - name: Name the test build
        id: tag
        run: |
          VER=$(grep '^mod_version=' versions/26.3/gradle.properties | cut -d= -f2)
          echo "tag=v${VER}-test" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
      # The workflow token may not move a tag across a change to this workflow file, but it may delete a tag and
      # create one: so the previous test release and its tag go, and the next step makes them again at this commit.
      - name: Remove the previous test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          git push origin ":refs/tags/$TAG" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hellcraft ${{ steps.tag.outputs.ver }} (test build)
          prerelease: true
          files: dist/*
          body: |
            Test build from `${{ github.ref_name }}` @ ${{ github.sha }}. Hellcraft 3.0 is being rebuilt (see `docs/REVAMP.md`), so test builds can change a lot.

            **New in phase 4 (Lower Hell, Dis to the Giants):** each lower circle has a rule to play with. **Heresy:** the tombs blast fire in turn (watch the red circles and cross between blasts). **Phlegethon:** ford the river of blood at its shallows while the centaurs on the banks look away. **The Wood of the Suicides:** sneak, or the trees scream and call the harpies. **The Burning Sands:** fire falls in waves; shelter under the rock arches. **Malebolge:** nothing is what it seems: chests that breathe are mimics, a Rest that isn't on your compass is a trap, thieves snatch from your pack, and the Malebranche hook you along red lines (and their captain Malacoda will kindly show you a bridge). Five new guardians on real bodies: **the Furies** (who call **Medusa**: don't look at her while her eyes glow), **Farinata** in his burning tomb, **the Minotaur** and **Geryon**. Beat Geryon and he flies you down the great cliff; **Antaeus** sets you down on the ice of Cocytus from the Well. New monsters: heretics, centaurs, harpies, mimics, thieves and the Malebranche. **Make a new world** (the guardians' lairs and Antaeus moved).

            **Phase 3 (Upper Hell, Limbo to Wrath):** each upper circle has a rule to play with instead of a debuff. **Lust:** white wind streams carry you down the circle (step in; sneak to let go). **Gluttony:** the mud swallows whoever stands still (keep moving, or stand on roots, stone or planks). **Greed:** gold draws hoarders that steal it (stash it in an ender chest). **Wrath:** hands drag swimmers under where the Styx bubbles (keep to the roads, or take a boat). Limbo's **Noble Castle** stands on the east road, with shades who talk, trade and give Codex pages. New set-pieces in every circle (soul flocks over Lust, rotting trees and sunken feast tables in the Mire, coin hills, vaults and giant scales in Greed, fog, reeds, boardwalks and watchtowers in the Fen). **Cerberus, Plutus and Phlegyas** have real bodies and fights in the danger language; light the east watchtower's beacons to call Phlegyas, and any watchtower's to call his ferry to Dis. New monsters: the lovers, the gluttons, the hoarders and the wrathful. Fair play: no PvP in the Dark Wood, the Shore and Limbo, two hours of newcomer protection, and Cain's Mark for killing much weaker souls. **From the first play session:** what characters say now appears in a **dialogue box** above the hotbar instead of the chat; the Fen is lighter and its fog thinner; walking into Phlegyas's ring of braziers wakes him too; the older bosses no longer show the mob inside their model when hit by a potion effect; and the Spines over Cocytus are bent and broken instead of straight and mirrored. **Make a new world** for the new set-pieces and the new Spines.

            **Phase 2 (boss tech, proven on Minos):** Minos has a real, animated body. Waking him plays a short cutscene (skippable once seen) with his name card. His fight speaks the danger language: **red** on the ground means get out, a **white** flash means raise your shield now (a block in time staggers him), **purple** can't be blocked, so jump it. Meeting him opens his entry in the Journal's Codex (J). The written guide book is gone: its pages are in the Journal.

            **Phase 1, the new map:** Hell is 7,000 blocks across (border at 3,500). Four paved roads (east, south, west and north) lead from the Gate of Hell to the Well of Giants, and every cliff has a way down every 30 degrees. Entering a circle shows a card saying what it does and what to bring. A compass at the top of the screen points to the next way down and the nearest Virgil's Rest. **M** opens the Map of Hell and **J** the Pilgrim's Journal. **Make a new world:** worlds from older builds have the old map.

            **Every player installs Hellcraft**, the same version as the server:
            - **Modrinth App / Prism Launcher:** download `Hellcraft-${{ steps.tag.outputs.ver }}-mc26.3.mrpack` and import it (it installs Minecraft 26.3, Fabric and Fabric API for you). Use it for single player and to join a Hellcraft server.
            - **Official Minecraft Launcher:** download `hellcraft-${{ steps.tag.outputs.ver }}-mc26.3-mods.zip` and follow `INSTALL.txt`.
            - **Single player:** Create New World, World tab, World Type: **Inferno** (turn on *Allow Commands* for `/hellcraft goto <zone>`).

            **Servers:** use `hellcraft-${{ steps.tag.outputs.ver }}-mc26.3.jar` with the Docker setup in the README (`itzg/minecraft-server:java25`, `VERSION` 26.3). Only port 25565 is needed. Players without the matching Hellcraft are told what to install.

  # A green push whose commit message contains [release] publishes a real (not pre-release) release,
  # tagged v<mod_version>, with the same downloads.
  stable-release:
    needs: [build-26, smoke-test-26, client-test-26]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hellcraft-singleplayer-26.3
          path: dist
      - uses: actions/checkout@v4
        with:
          path: src
      - id: ver
        run: echo "ver=$(grep '^mod_version=' src/versions/26.3/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: Hellcraft ${{ steps.ver.outputs.ver }}
          prerelease: false
          make_latest: true
          files: dist/*
          body: |
            **Hellcraft ${{ steps.ver.outputs.ver }}**: the overworld becomes Dante's Inferno, and blood is fuel.

            - Nine circles of Hell from the Dark Wood to Judecca, with torments, tougher monsters the deeper you go, and lifesteal hearts (Hell is full: run out and you become a ghost until friends revive you at a Blood Altar).
            - The three-phase Lucifer fight at the bottom of the world.
            - **26.3 adds:** hell weapons and blood armour, five circle guardians (Minos, Cerberus, Plutus, the Minotaur, Geryon), the four Emperor's Spines, Lucifer's own models and the Emperor frozen in the ice, the climb out to Purgatory, ghost powers, the Pilgrim's Guide, and circle ambience.
            - **New in 1.1 (26.3):** fairer deaths (only players take your hearts; the Vigil Candle and Soul Anchor bring you back), gentler circles with Virgil's Rests as safe havens and free travel between the circles you've explored, sugar cane, villages whose villagers take jobs, more apples, blood gear that charges by killing, the Nether reforged as the Forge of Dis (Vulcan and the Hellforge), and the End become Paradiso (nine heavenly spheres, the Seraph, relics, and the Ascent from Purgatory).
            - **New in 2.0 (26.3):**
              - **The Seven P's:** heart prestige. When your veins are full, ascend at a Blood Altar: your hearts fall back to 10, a P is burned from your brow, you can hold 2 more hearts for good, and you keep a virtue (lighter falls, more fragments, steadier feet, speed, luck, less hunger, and at the seventh no torments). Ranks show as a coloured cross before your name.
              - **The Blood Heart HUD:** bleeding hearts in the health bar, rimmed bronze to white by rank.
              - **The Hall of the Damned:** a monument at spawn naming the Inferno's best and most damned.
              - **Dante's Journey:** an advancement tab of 29 milestones from the Dark Wood to the Empyrean.
            - **New in 2.0.1 (26.3):**
              - **Redrawn textures:** every item icon hand-redrawn (the Blood Heart is now an anatomical heart), plus richer guardian and Lucifer textures and new worn blood armour with a skull visor.
              - **The Blood Pickaxe:** vein-mines ores, and its Blood Art Excavate digs 3x3.
              - **Stronger weapons cost Blood Hearts:** the Reaper of Minos takes 2, the Tithe Axe and Blood Pickaxe 1 (plus fragments).
              - **Guardians can't be farmed:** spoils are personal. Your first victory over each guardian pays in full, after that 1 heart once every 3 hours, and only a few fragments in between.
              - **A calmer Lust:** gentler gusts every 5-9 s, only while you're on the ground, and breezes are rare.
              - **`/hellcraft whiteroom`:** operators can shut a player in a depthless white room and let them out again.
            - **New in 2.0.2 (26.3):**
              - **Lucifer always pays out:** the fight now watches the true form itself, so killing it always ends the fight, opens the burrow and hands out the rewards (the Emperor also rises if the Morning Star dies outright). For a fight that went wrong earlier, `/hellcraft lucifer grant <players>` and `/hellcraft lucifer burrow`.
              - **No boss farming:** every boss (the guardians, Lucifer, the Wither, the Warden and the Ender Dragon) pays its full spoils once per player, then only after a cooldown (3 hours, 6 for Lucifer).
              - **A heart ceiling:** nobody holds more than 40 hearts (`heartCeiling`); extra hearts are trimmed on join and respawn.
              - **The bounty:** every 20 minutes the strongest soul (25+ hearts) is marked. They glow, the server is told roughly where they are, and whoever kills them gets 3 Blood Hearts.
              - **Admin toolkit:** `/hellcraft inspect`, `setbonus`, `reset`, `strip`, `bounty` and `config <key> [value]`.
              - **Villagers breed again:** they keep their own 10-minute day (work, meet at the bell, then idle time when they breed) under Hell's endless dusk.
            - **New in 2.0.3 (26.3):**
              - **Boss textures fixed:** the guardians and Lucifer no longer show as black and magenta squares.
              - **Animated bosses:** they rise out of the ground and roar, breathe, walk with a bob, rear back before each attack and lunge into it, flash red when hit, and topple over when they die.
              - **No more cheese:** boss hits grow with your hearts (40 hearts doesn't make you a tank), arrows do 40% to guardians and the Morning Star, shooting a guardian from far away gets you pulled in, guardians can only be hurt from inside their lair, and there's no building or perching in a lair during a fight.
              - **STYLE ranks, like ULTRAKILL:** every boss fight ranks your style from D to SSS in your own boss bar (hit hard, swap weapons, don't get hit). Every win pays Blood Fragments by rank, S or better adds treasure, and your first S and first SSS on each boss are worth a Blood Heart each.
              - **Plain language:** messages, menus, item descriptions, the guide book and advancements now say what happened and what to do. Blood armour is now the Blood Helmet, Chestplate, Leggings and Boots.
              - **The End after the dragon:** End cities and chorus plants in every ring from the first one, clear directions when the dragon dies, ring titles that say where you are, and a Rose Compass that points to the Celestial Rose.

            **Play in single player**
            - **Modrinth App / Prism Launcher / CurseForge:** download `Hellcraft-${{ steps.ver.outputs.ver }}-mc<version>.mrpack` and import it (it installs Fabric + Fabric API for you).
            - **Official Minecraft Launcher:** download `hellcraft-${{ steps.ver.outputs.ver }}-mc<version>-mods.zip` and follow `INSTALL.txt`.
            - Then **Create New World → World tab → World Type: Inferno** (turn on *Allow Commands* for `/hellcraft goto <zone>`).

            **Servers:** use `hellcraft-${{ steps.ver.outputs.ver }}-mc<version>.jar` with the Docker setup in the README (set `VERSION` to the same Minecraft version; 26.3 needs the `java25` image).
            On 26.3 each player is sent the Hellcraft resource pack (models and music) from the address they joined with, so `musicPackHost` can stay empty; port **25566** must still be published and forwarded just like 25565.
