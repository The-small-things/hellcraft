name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: hellcraft-jar
          path: build/libs/hellcraft-*.jar
          if-no-files-found: error

  # Boots a real Fabric 1.21.1 server (the same Docker image used for hosting) with the mod,
  # generates chunks in every circle of Hell and fails on any error in the log.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hellcraft-jar
          path: mods
      - name: Smoke test on a real server
        run: bash scripts/smoke-test.sh mods
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: smoke-server.log
