name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Hellcraft for Minecraft 26.3 (versions/26.3), built with Java 25. The 1.21.1 project at the repository
  # root is frozen and no longer built.
  build-26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (26.3)
        working-directory: versions/26.3
        run: ./gradlew build --stacktrace
      - name: Upload mod jar (26.3)
        uses: actions/upload-artifact@v4
        with:
          name: hellcraft-jar-26.3
          path: versions/26.3/build/libs/hellcraft-*.jar
          if-no-files-found: error
      - name: Package single-player downloads (26.3)
        run: bash scripts/package-singleplayer.sh versions/26.3
      - name: Upload single-player downloads (26.3)
        uses: actions/upload-artifact@v4
        with:
          name: hellcraft-singleplayer-26.3
          path: dist/*
          if-no-files-found: error

  # Boots a real Fabric 26.3 server (the same Docker image used for hosting, Java 25) with the mod,
  # generates chunks in every circle of Hell and fails on any error in the log.
  smoke-test-26:
    needs: build-26
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hellcraft-jar-26.3
          path: mods
      - name: Install ffmpeg (for a test music track)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Smoke test on a real 26.3 server
        env:
          MC_VERSION: "26.3"
          MC_IMAGE: itzg/minecraft-server:java25
        run: bash scripts/smoke-test.sh mods
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-26.3
          path: smoke-server.log

  # A real Minecraft client, headless (Xvfb, software Vulkan): joins a dedicated server and a single-player world,
  # and screenshots the HUD, the blood items and the animated test rig (see versions/26.3/src/gametest).
  client-test-26:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display and software graphics
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
      - name: Client game tests
        run: bash tools/dev/clienttest.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots-26.3
          path: versions/26.3/build/run/clientGameTest/screenshots
          if-no-files-found: warn

  # Publishes the single-player downloads as a GitHub pre-release so they can be grabbed with one click.
  release:
    needs: [build-26, smoke-test-26, client-test-26]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    # one test release at a time: two pushes in a row must not race over the same tag
    concurrency:
      group: test-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hellcraft-singleplayer-26.3
          path: dist
      - name: Name the beta
        id: tag
        run: |
          VER=$(grep '^mod_version=' versions/26.3/gradle.properties | cut -d= -f2)
          echo "tag=v${VER}-beta" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
      # The workflow token may not move a tag across a change to this workflow file, but it may delete a tag and
      # create one: so the previous beta and its tag go, and the next step makes them again at this commit. Older
      # pre-releases (betas of earlier versions, the old "-test" builds) go too, so only one beta is ever up.
      - name: Remove the previous beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          git push origin ":refs/tags/$TAG" || true
          for OLD in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName'); do
            gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hellcraft ${{ steps.tag.outputs.ver }} beta
          prerelease: true
          files: dist/*
          body: |
            **Beta** from `${{ github.ref_name }}` @ ${{ github.sha }}: the next version, being tested before it becomes a stable release, so it can still change. For the stable version, take the latest release (not a beta). A server and its players need the same beta.

            **New in 3.1.0 (beta):** **A Hellcraft title screen:** the HELLCRAFT logo burning over a painted view of Hell from the Walls of Dis (Lucifer's wings in the pit, the river of blood, the circles rising behind), embers rising, the gate's words and Dante for the splash. **Boss blows hit hard:** every danger mark erupts as its blow lands, in its colour (red bursts into fire, smoke and flying earth, white cracks with light and sparks, purple tears open in violet), its edge throws out a shockwave and the view shakes if you're close; the bosses' other effects are twice as dense and show from across the arena whatever your particle setting. SHADES_NOTE Same world as 3.0 (no new world needed).

            **From the 3.0 playtest:** the map is half as wide again (radius 5,250), so every circle is wider. **A shield blocks a boss's blow the moment it's raised**, so a late block on a white flash counts. Lust's **lovers** dive one pair at a time, and a dive blocked with a shield knocks them to the ground, stunned. Danger marks show over Cocytus's snow. The **roads** climb on stairs, some askew, with cracked and broken stones, and one circle's stone mixes into the next. **Lucifer is harder:** his fight runs faster and hits harder; the Fallen Seraph's wings turn most blows aside until you block his white slash (then he takes extra), and trading blows draws a riposte; the Emperor picks his blows at random, with little rest, and has new ones (both hands at once, a hand dragged round the ice, a frozen breath that sweeps a red wedge) while icicles keep falling. The climb out after him says plainly what is happening. Phlegyas swings his oar right round at arm's length (the purple ring is its reach), the Minotaur charges on both legs, and the bosses' and monsters' skins, fur and metal, and the blood armour's icons, are redrawn. **Every boss and monster has a new, more lifelike body** (faces with brows, noses and jaws, hands with fingers, wings of real feathers, layered clothes and armour; Cerberus bites forward, the centaurs aim their bows ahead, the harpies' wings beat the right way and the Malebranche keep their hooks in hand), and the Blood Heart and Tithe Axe have new icons. **The Wood of the Suicides is a thicket** now: gnarled trees with branches at head height and black thorns that slow you and tear you unless you sneak (sneaking is also what keeps the trees from screaming); the roads through it stay clear. **Angels fill Paradiso:** a host wheels round every sphere's island and a swarm flies in and out of the Celestial Rose, and the Angelic Guard are real angels now. **Make a new world.**

            **New since phase 7 (Phase 8 so far):** ops can give anyone a testing kit with `/hellcraft loadout [players] [kit]` (works in single player with cheats on): the journey kits `upper`, `lower`, `lucifer` and `paradiso` give about what you'd have by then, hearts included (10, 12, 15, 18), to test the bosses fairly without the grind; `/hellcraft arena <boss> [lair] [players]` takes you to the edge of any boss's arena; `full` (the default) and `blood` give everything at once (maxed armour, every weapon, 16 ender pearls, 16 enchanted golden apples, totems). Every guardian of Hell now says something about Lucifer as it falls, and the Journal's Codex has a page on **the Emperor** that fills in, one piece for each guardian you beat. In boss fights your **style rank** now has its own panel on the right of the screen (the rank, a meter to the next one, and what just scored or cost you). Beat Minos, Cerberus, Plutus, Farinata or the Minotaur and its lair keeps a **lift** for you: stand in the soul fire in the middle for 3 seconds to go down to the next circle. The Foundry Halls' pillars have **chain-lifts** instead of ladders: stand on the plate by the chain to ride up to the arm, sneak to float down. In Paradiso, Beatrice gives the tips. **Every guardian of Hell now has four lairs** in its circle, one in each quarter of Hell (Phlegyas a landing by every watchtower, the Furies one inside every gate of Dis): fight it in whichever is nearest. There are **eight Virgil's Rests in every circle** now (four more between the roads, at the foot of a way down; Malebolge keeps four, its other bridges have the fake ones), and the travel menu has pages. **Make a new world** for the new lairs' level floors (in an old world they're built where the ground lies). The **relics** are real items now: the Halo is a gold circlet you wear, the Seraph Wings have white feathers, and Beatrice's Rose shows its hour's wait on the item.

            **New in phase 7 (Purgatory and Paradiso):** **Purgatory** is its own world now, a mountain island in a starlit sea before dawn (the burrow and the climb out after Lucifer still take you there). **The Ascent** on its summit takes those who have beaten Lucifer up into **Paradiso**, also its own world: nine spheres of floating islands stacked one above the other, each with its own look, and the **Celestial Rose** in the Empyrean on top. In each sphere cross from the arrival isle to the great island, pass its short **trial** (gather the lights only you can see, against the clock on Mercury, catching them on Venus, in order on Jupiter's Eagle, up Jacob's Ladder on Saturn; beat the Angelic Guard on Mars), then stand in the **column of light** on the departure isle to rise to the next (hold sneak to sink back down). Falling can't hurt you there: angels catch you. The compass points the way. In the ninth sphere **the Seraph**, a six-winged angel on a real body, is the last trial (block its white wing-blow, run IN close for its Gloria, jump the turning heavens); beaten, it gives a **Halo**. Saturn gives **Seraph Wings**, the Rose's bell **Beatrice's Rose**. There are **no strongholds** any more (the End is vanilla and out of reach), and the Journal's second page tells the whole journey. **Make a new world.**

            **Phase 6 (the Nether: the Forge of Dis):** the Nether is built from scratch round **the Great Forge**, Vulcan's smithy on a mesa at its centre (0, 0). Round the mesa lies **the Slag Sea**: cross it on the cooling crust, and keep moving, because it cracks under you and melts (four causeways of crust run straight to the stairs up the mesa). Beyond it lie four regions: **the Foundry Halls** (north: rivers of lava and great pillars with ladders), **the Chainlands** (east: islands hung on chains over the lava, joined by bridges), **the Ash Wastes** (south: piglins, bastions and fortresses) and **the Cyclops Quarries** (west: terraces with ramps, and the Cyclopes' camps). A column of heat rises over the Forge, and in the Nether the compass points to it. **Vulcan** fights on a real body now, with an entrance and the danger language (block his white hammer blow, jump his shockwave, step off his chain's red line; at half health the floor's seams burst). **The Cyclopes** are mini-bosses by their fires: block the maul, dodge the boulder, jump the stamp. **Make a new world.**

            **Phase 5 (Lucifer):** Cocytus is cold: the cold builds while you're away from fire, so light the **braziers** on the ice (flint and steel or a torch); they stay lit for everyone. Every few minutes **Lucifer's wings beat** all over Hell, and from the Well of Giants you see them turning far off in the fog like a windmill. His pit is now a 70-block floor of ice. Step onto it and the fight starts in 30 seconds (sooner once everyone near is in), with a warning before the point of no return. **The Fallen Seraph** comes down in a cutscene and duels you in the danger language (block the white, dodge the red and purple); at half health he snaps and the traitors rise. Break him and **the mountain in the pit opens its eyes:** the Three-Faced Emperor, 10 times your height, who can only be hurt on the hands and faces he leaves down (block his bite to keep a face down longer) and whose wingbeat you hide from behind the six ice pillars. Beat him and you climb down his side and out to Purgatory. **From the Phase 4 play session:** the pit has no holes left to hide in, the lairs and Rests are spread out so each sits in its own circle, the roads are ruins with slab steps, Antaeus's arm swings the right way (and every boss's blows face forward), Geryon flies you a long way down, Lust has many more wind streams, and the ferry no longer drags you through blocks and lands you inside the Walls of Dis. **Make a new world.**

            **Phase 4 (Lower Hell, Dis to the Giants):** each lower circle has a rule to play with. **Heresy:** the tombs blast fire in turn (watch the red circles and cross between blasts). **Phlegethon:** ford the river of blood at its shallows while the centaurs on the banks look away. **The Wood of the Suicides:** sneak, or the trees scream and call the harpies. **The Burning Sands:** fire falls in waves; shelter under the rock arches. **Malebolge:** nothing is what it seems: chests that breathe are mimics, a Rest that isn't on your compass is a trap, thieves snatch from your pack, and the Malebranche hook you along red lines (and their captain Malacoda will kindly show you a bridge). Five new guardians on real bodies: **the Furies** (who call **Medusa**: don't look at her while her eyes glow), **Farinata** in his burning tomb, **the Minotaur** and **Geryon**. Beat Geryon and he flies you down the great cliff; **Antaeus** sets you down on the ice of Cocytus from the Well. New monsters: heretics, centaurs, harpies, mimics, thieves and the Malebranche. **Make a new world** (the guardians' lairs and Antaeus moved). **From the Phase 4 play session:** the bosses fight at 60% of their old pace (longer wind-ups, warnings and parry windows; `bossTempo`), Geryon sinks low after each attack and the Furies land after their talons, so they can be hit, Lucifer hits for 70%, and more hearts help again (boss hits grow half as fast with them). The hell weapons and blood armour are real items now (and become infernal items at a Hellforge; old ones keep working). New: five enchantments found only in one circle each, among them **Sidestep** (leggings), which adds a **Dash** key (Left Alt) that dodges boss blows.

            **Phase 3 (Upper Hell, Limbo to Wrath):** each upper circle has a rule to play with instead of a debuff. **Lust:** white wind streams carry you down the circle (step in; sneak to let go). **Gluttony:** the mud swallows whoever stands still (keep moving, or stand on roots, stone or planks). **Greed:** gold draws hoarders that steal it (stash it in an ender chest). **Wrath:** hands drag swimmers under where the Styx bubbles (keep to the roads, or take a boat). Limbo's **Noble Castle** stands on the east road, with shades who talk, trade and give Codex pages. New set-pieces in every circle (soul flocks over Lust, rotting trees and sunken feast tables in the Mire, coin hills, vaults and giant scales in Greed, fog, reeds, boardwalks and watchtowers in the Fen). **Cerberus, Plutus and Phlegyas** have real bodies and fights in the danger language; light the east watchtower's beacons to call Phlegyas, and any watchtower's to call his ferry to Dis. New monsters: the lovers, the gluttons, the hoarders and the wrathful. Fair play: no PvP in the Dark Wood, the Shore and Limbo, two hours of newcomer protection, and Cain's Mark for killing much weaker souls. **From the first play session:** what characters say now appears in a **dialogue box** above the hotbar instead of the chat; the Fen is lighter and its fog thinner; walking into Phlegyas's ring of braziers wakes him too; the older bosses no longer show the mob inside their model when hit by a potion effect; and the Spines over Cocytus are bent and broken instead of straight and mirrored. **Make a new world** for the new set-pieces and the new Spines.

            **Phase 2 (boss tech, proven on Minos):** Minos has a real, animated body. Waking him plays a short cutscene (skippable once seen) with his name card. His fight speaks the danger language: **red** on the ground means get out, a **white** flash means raise your shield now (a block in time staggers him), **purple** can't be blocked, so jump it. Meeting him opens his entry in the Journal's Codex (J). The written guide book is gone: its pages are in the Journal.

            **Phase 1, the new map:** Hell is 7,000 blocks across (border at 3,500). Four paved roads (east, south, west and north) lead from the Gate of Hell to the Well of Giants, and every cliff has a way down every 30 degrees. Entering a circle shows a card saying what it does and what to bring. A compass at the top of the screen points to the next way down and the nearest Virgil's Rest. **M** opens the Map of Hell and **J** the Pilgrim's Journal. **Make a new world:** worlds from older builds have the old map.

            **Every player installs Hellcraft**, the same version as the server:
            - **Modrinth App / Prism Launcher:** download `Hellcraft-${{ steps.tag.outputs.ver }}-mc26.3.mrpack` and import it (it installs Minecraft 26.3, Fabric and Fabric API for you). Use it for single player and to join a Hellcraft server.
            - **Official Minecraft Launcher:** download `hellcraft-${{ steps.tag.outputs.ver }}-mc26.3-mods.zip` and follow `INSTALL.txt`.
            - **Single player:** Create New World, World tab, World Type: **Inferno** (turn on *Allow Commands* for `/hellcraft goto <zone>`).

            **Servers:** use `hellcraft-${{ steps.tag.outputs.ver }}-mc26.3.jar` with the Docker setup in the README (`itzg/minecraft-server:java25`, `VERSION` 26.3). Only port 25565 is needed. Players without the matching Hellcraft are told what to install.

  # A green push whose commit message contains [release] publishes a real (not pre-release) release,
  # tagged v<mod_version>, with the same downloads.
  stable-release:
    needs: [build-26, smoke-test-26, client-test-26]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hellcraft-singleplayer-26.3
          path: dist
      - uses: actions/checkout@v4
        with:
          path: src
      - id: ver
        run: echo "ver=$(grep '^mod_version=' src/versions/26.3/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: Hellcraft ${{ steps.ver.outputs.ver }}
          prerelease: false
          make_latest: true
          files: dist/*
          body: |
            **Hellcraft ${{ steps.ver.outputs.ver }}**: the overworld becomes Dante's Inferno, and blood is fuel.

            - Nine circles of Hell from the Dark Wood to Judecca, each with a rule to play with, its own monsters and its guardians, and lifesteal hearts (Hell is full: run out and you become a ghost until friends revive you at a Blood Altar).
            - Lucifer at the bottom of the world: the Fallen Seraph's duel, then the Three-Faced Emperor in the ice.
            - Then the Forge of Dis (the Nether), Purgatory's island and the nine spheres of Paradiso up to the Celestial Rose.

            **Every player installs Hellcraft** (single player too), the same version as the server, and **3.0 needs a new world.**

            - **New in 3.0.0 (26.3): Hellcraft rebuilt.**
              - **A new map:** Hell is 10,500 blocks across. Four Pilgrim Roads run from the Gate of Hell to the Well of Giants, every cliff has a way down every 30 degrees, and entering a circle shows a card saying what it does and what to bring. A compass at the top of the screen points to the next way down and the nearest Virgil's Rest (eight in every circle, with free travel between those you've found). **M** opens the Map of Hell, **J** the Pilgrim's Journal (the guide, the Codex of bosses and the story of the journey).
              - **Real bosses:** Minos, Cerberus, Plutus, Phlegyas, the Furies with Medusa, Farinata, the Minotaur, Geryon, Antaeus, Lucifer, Vulcan, the Cyclopes and the Seraph all have animated bodies, entrances and fights in one danger language: **red** on the ground means get out, a **white** flash means raise your shield now (a block in time staggers them), **purple** can't be blocked, so jump it or keep out. Each guardian of Hell has four lairs in its circle, never blocks the way down, and leaves a lift to the next circle once beaten. A style panel ranks every fight from D to SSS. Geryon flies you down the great cliff and Antaeus sets you on the ice.
              - **Circles to play with instead of debuffs:** Lust's wind streams carry you, Gluttony's mud swallows whoever stands still, hoarders steal Greed's gold, the sullen drag swimmers under the Styx, Heresy's tombs blast fire in turn, the centaurs guard Phlegethon's fords, the Wood of the Suicides is a thicket of thorns (sneak, or the trees scream and call the harpies), fire falls on the Burning Sands, nothing in Malebolge is what it seems, and Cocytus is cold away from the braziers. New monsters in every circle, the Noble Castle in Limbo, and set-pieces everywhere.
              - **Lucifer:** step onto the ice of his pit for the ready check. The Fallen Seraph comes down and duels you; break him and the mountain opens its eyes: the Three-Faced Emperor, hurt only on the hands and faces he leaves down, whose wingbeat you hide from behind the ice pillars. Beat him and climb down his side and out to Purgatory, all in cutscenes.
              - **The Forge of Dis:** the Nether is rebuilt round Vulcan's Great Forge, across a Slag Sea of cracking crust, with four regions (the Foundry Halls, the Chainlands, the Ash Wastes, the Cyclops Quarries).
              - **Purgatory and Paradiso:** Purgatory is a mountain island in its own starlit sea. The Ascent on its summit takes those who have beaten Lucifer up through nine spheres of floating islands, each with a short trial and a column of light to the next, with angels wheeling round every sphere. The Seraph waits in the ninth, and the Celestial Rose crowns the Empyrean. Relics: the Halo, the Seraph Wings and Beatrice's Rose.
              - **Real items and blocks:** the Blood Heart, Fragments, the hell weapons, blood armour (infernal at a Hellforge) and relics are real items with their own art; five enchantments are found only in one circle each, among them **Sidestep**, which adds a Dash (Left Alt). What characters say appears in a dialogue box above the hotbar.
              - **For ops:** `/hellcraft loadout [players] [kit]` gives testing kits (`upper`, `lower`, `lucifer`, `paradiso`, `full`) and `/hellcraft arena <boss>` takes you to the edge of any boss's arena.
            - **26.3 adds:** hell weapons and blood armour, five circle guardians (Minos, Cerberus, Plutus, the Minotaur, Geryon), the four Emperor's Spines, Lucifer's own models and the Emperor frozen in the ice, the climb out to Purgatory, ghost powers, the Pilgrim's Guide, and circle ambience.
            - **New in 1.1 (26.3):** fairer deaths (only players take your hearts; the Vigil Candle and Soul Anchor bring you back), gentler circles with Virgil's Rests as safe havens and free travel between the circles you've explored, sugar cane, villages whose villagers take jobs, more apples, blood gear that charges by killing, the Nether reforged as the Forge of Dis (Vulcan and the Hellforge), and the End become Paradiso (nine heavenly spheres, the Seraph, relics, and the Ascent from Purgatory).
            - **New in 2.0 (26.3):**
              - **The Seven P's:** heart prestige. When your veins are full, ascend at a Blood Altar: your hearts fall back to 10, a P is burned from your brow, you can hold 2 more hearts for good, and you keep a virtue (lighter falls, more fragments, steadier feet, speed, luck, less hunger, and at the seventh no torments). Ranks show as a coloured cross before your name.
              - **The Blood Heart HUD:** bleeding hearts in the health bar, rimmed bronze to white by rank.
              - **The Hall of the Damned:** a monument at spawn naming the Inferno's best and most damned.
              - **Dante's Journey:** an advancement tab of 29 milestones from the Dark Wood to the Empyrean.
            - **New in 2.0.1 (26.3):**
              - **Redrawn textures:** every item icon hand-redrawn (the Blood Heart is now an anatomical heart), plus richer guardian and Lucifer textures and new worn blood armour with a skull visor.
              - **The Blood Pickaxe:** vein-mines ores, and its Blood Art Excavate digs 3x3.
              - **Stronger weapons cost Blood Hearts:** the Reaper of Minos takes 2, the Tithe Axe and Blood Pickaxe 1 (plus fragments).
              - **Guardians can't be farmed:** spoils are personal. Your first victory over each guardian pays in full, after that 1 heart once every 3 hours, and only a few fragments in between.
              - **A calmer Lust:** gentler gusts every 5-9 s, only while you're on the ground, and breezes are rare.
              - **`/hellcraft whiteroom`:** operators can shut a player in a depthless white room and let them out again.
            - **New in 2.0.2 (26.3):**
              - **Lucifer always pays out:** the fight now watches the true form itself, so killing it always ends the fight, opens the burrow and hands out the rewards (the Emperor also rises if the Morning Star dies outright). For a fight that went wrong earlier, `/hellcraft lucifer grant <players>` and `/hellcraft lucifer burrow`.
              - **No boss farming:** every boss (the guardians, Lucifer, the Wither, the Warden and the Ender Dragon) pays its full spoils once per player, then only after a cooldown (3 hours, 6 for Lucifer).
              - **A heart ceiling:** nobody holds more than 40 hearts (`heartCeiling`); extra hearts are trimmed on join and respawn.
              - **The bounty:** every 20 minutes the strongest soul (25+ hearts) is marked. They glow, the server is told roughly where they are, and whoever kills them gets 3 Blood Hearts.
              - **Admin toolkit:** `/hellcraft inspect`, `setbonus`, `reset`, `strip`, `bounty` and `config <key> [value]`.
              - **Villagers breed again:** they keep their own 10-minute day (work, meet at the bell, then idle time when they breed) under Hell's endless dusk.
            - **New in 2.0.3 (26.3):**
              - **Boss textures fixed:** the guardians and Lucifer no longer show as black and magenta squares.
              - **Animated bosses:** they rise out of the ground and roar, breathe, walk with a bob, rear back before each attack and lunge into it, flash red when hit, and topple over when they die.
              - **No more cheese:** boss hits grow with your hearts (40 hearts doesn't make you a tank), arrows do 40% to guardians and the Morning Star, shooting a guardian from far away gets you pulled in, guardians can only be hurt from inside their lair, and there's no building or perching in a lair during a fight.
              - **STYLE ranks, like ULTRAKILL:** every boss fight ranks your style from D to SSS in your own boss bar (hit hard, swap weapons, don't get hit). Every win pays Blood Fragments by rank, S or better adds treasure, and your first S and first SSS on each boss are worth a Blood Heart each.
              - **Plain language:** messages, menus, item descriptions, the guide book and advancements now say what happened and what to do. Blood armour is now the Blood Helmet, Chestplate, Leggings and Boots.
              - **The End after the dragon:** End cities and chorus plants in every ring from the first one, clear directions when the dragon dies, ring titles that say where you are, and a Rose Compass that points to the Celestial Rose.

            **Every player installs Hellcraft**, the same version as the server:
            - **Modrinth App / Prism Launcher:** download `Hellcraft-${{ steps.ver.outputs.ver }}-mc26.3.mrpack` and import it (it installs Minecraft 26.3, Fabric and Fabric API for you). Use it for single player and to join a Hellcraft server.
            - **Official Minecraft Launcher:** download `hellcraft-${{ steps.ver.outputs.ver }}-mc26.3-mods.zip` and follow `INSTALL.txt`.
            - **Single player:** Create New World, World tab, World Type: **Inferno** (turn on *Allow Commands* for `/hellcraft goto <zone>`).

            **Servers:** use `hellcraft-${{ steps.ver.outputs.ver }}-mc26.3.jar` with the Docker setup in the README (`itzg/minecraft-server:java25`, `VERSION` 26.3) and **a new world**. Only port 25565 is needed: all the art ships in the mod. Players without the matching Hellcraft are told what to install.
